name: Update README Stats

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/readme-stats.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Yesy01&show_icons=true&theme=transparent&title_color=FFAB00&text_color=F5F5F5&icon_color=FFAB00&border_color=2C2C2C
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Yesy01&layout=compact&langs_count=6&theme=transparent&title_color=FFAB00&text_color=F5F5F5&border_color=2C2C2C
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update profile stats cards" || exit 0
          git push
